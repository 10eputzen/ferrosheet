[package]
name = "ferrosheet-core"
description = "Spreadsheet loading, formatting, selection and search for ferrosheet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
calamine = { version = "0.38", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
regex = "1"
# Formula engine for editing; only used once the user edits a cell.
ironcalc = "0.9.1"
# Looks inside .xlsx files for parts saving would drop.
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
rust_xlsxwriter = "0.102"
