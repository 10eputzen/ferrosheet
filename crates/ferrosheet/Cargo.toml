[package]
name = "ferrosheet"
description = "Fast, lightweight spreadsheet viewer (xls, xlsx, xlsb, ods, csv)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ferrosheet-core.workspace = true
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
rfd = "0.18"
# Only for the screenshot feature.
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
sys-locale = "0.3.2"
ed25519-compact = { version = "2.6.1", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[features]
# Saves a screenshot when FERROSHEET_SCREENSHOT is set (docs and visual checks).
screenshot = ["dep:image"]

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
rust_xlsxwriter = "0.102"

# Puts the icon into the exe, for Explorer, Start menu, taskbar and associated files.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
