[workspace]
resolver = "3"
members = ["crates/ferrosheet-core", "crates/ferrosheet"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/10eputzen/ferrosheet"
authors = ["Stefan Landvogt"]

[workspace.dependencies]
ferrosheet-core = { path = "crates/ferrosheet-core" }

[profile.release]
opt-level = 3
# Thin LTO over 16 parallel units: release builds take about half the time of fat LTO
# with one unit, for a few percent in size and speed.
lto = "thin"
# Unwind, not abort: a panic inside the file parser is caught and shown as an error.
strip = true

# Fast iteration but quick enough to judge scrolling in debug builds
[profile.dev.package."*"]
opt-level = 2

# CI: tests only, so no optimised dependencies and no debug info – far less to compile.
[profile.ci]
inherits = "dev"
debug = false
incremental = false

[profile.ci.package."*"]
opt-level = 0
